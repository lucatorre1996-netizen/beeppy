# Manda le notifiche ai giocatori.
#
# Gira qui e non nel browser perché firmarle richiede una chiave privata, che
# nel frontend sarebbe leggibile da chiunque.
#
# PRIMA DI ACCENDERLO servono tre segreti nel repository
# (Settings → Secrets and variables → Actions → New repository secret):
#
#   VAPID_PRIVATE_KEY       la chiave privata, da `npm run chiavi-push`
#                           (va bene anche il nome BEEPPY: vedi sotto)
#   VAPID_PUBLIC_KEY        la chiave pubblica, la stessa che sta in js/config.js
#   SUPABASE_SERVICE_ROLE   Project Settings → API → service_role
#                           (scavalca ogni permesso: non deve uscire da qui)
#
# Finché mancano, il lavoro gira a vuoto e si limita a dire cosa avrebbe mandato:
# così si possono controllare le regole senza disturbare nessuno.
name: Notifiche ai giocatori

on:
  schedule:
    # Ogni due ore: non per mandare più notifiche — quelle hanno i loro limiti
    # e restano una ogni due giorni per persona — ma perché un annuncio messo in
    # coda dal pannello parta entro un tempo ragionevole. Fra le 23 e le 8 il
    # lavoro gira ma non spedisce nulla: lo decide decidi.js.
    - cron: '5 */2 * * *'
  workflow_dispatch:
    inputs:
      titolo:
        description: 'Titolo (lascia vuoto per le notifiche automatiche)'
        required: false
      testo:
        description: 'Testo dell annuncio'
        required: false
      manda:
        description: 'Spedire davvero? Senza spunta fa solo la prova a vuoto'
        type: boolean
        default: false

jobs:
  notifiche:
    runs-on: ubuntu-latest
    steps:
      # v5 e non v4: GitHub sta dismettendo Node 20 per le proprie azioni, e le
      # v4 venivano forzate su Node 24 con un avviso a ogni giro.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Dice quali segreti trova e quali no, senza mai mostrarne il contenuto.
      # Serve a scoprire subito un nome scritto male, invece di ritrovarsi con
      # un lavoro che non manda niente e non spiega perché.
      - name: Controlla i segreti
        env:
          PRIV: ${{ secrets.VAPID_PRIVATE_KEY || secrets.BEEPPY }}
          PUB: ${{ secrets.VAPID_PUBLIC_KEY }}
          SERV: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          stato() { if [ -n "$2" ]; then echo "  $1: presente (${#2} caratteri)"; else echo "  $1: MANCA"; fi; }
          echo "Segreti configurati:"
          stato "chiave privata (VAPID_PRIVATE_KEY o BEEPPY)" "$PRIV"
          stato "chiave pubblica (VAPID_PUBLIC_KEY)" "$PUB"
          stato "chiave di servizio (SUPABASE_SERVICE_ROLE)" "$SERV"
          if [ -n "$PRIV" ] && [ "${#PRIV}" -ne 43 ]; then
            echo "::warning::La chiave privata dovrebbe essere di 43 caratteri, ne ha ${#PRIV}."
          fi
          if [ -n "$PUB" ] && [ "${#PUB}" -ne 87 ]; then
            echo "::warning::La chiave pubblica dovrebbe essere di 87 caratteri, ne ha ${#PUB}."
          fi

      - name: Installa la libreria per l'invio
        run: npm install web-push@3 --no-save

      - name: Decidi e manda
        env:
          SUPABASE_URL: https://capyfbcjxkjkyeigciqb.supabase.co
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          # Accettiamo anche il nome BEEPPY: è così che è stato salvato la prima
          # volta, e far rigenerare una chiave privata per un nome sbagliato
          # significa rischiare di perderla. Il codice si adatta a com'è il
          # mondo, non il contrario.
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY || secrets.BEEPPY }}
          VAPID_SUBJECT: mailto:lucatorre1996@gmail.com
        run: |
          set -e
          if [ -z "$SUPABASE_SERVICE_ROLE" ]; then
            echo "::warning::Segreti non configurati: niente da fare."
            echo "Aggiungi VAPID_PRIVATE_KEY, VAPID_PUBLIC_KEY e SUPABASE_SERVICE_ROLE"
            echo "in Settings → Secrets and variables → Actions."
            exit 0
          fi

          ARG=""
          # l'invio automatico parte dal cron; a mano solo con la spunta
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.manda }}" = "true" ]; then
            ARG="--manda"
          fi
          if [ -n "${{ inputs.titolo }}" ]; then
            ARG="$ARG --titolo \"${{ inputs.titolo }}\" --testo \"${{ inputs.testo }}\""
          fi

          eval node scripts/notifiche/invia.js $ARG
